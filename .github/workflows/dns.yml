name: dns

on:
  pull_request:
    paths:
      - dnsconfig.js
      - creds.json
      - .github/workflows/dns.yml
  push:
    branches: [main]
    paths:
      - dnsconfig.js
      - creds.json
      - .github/workflows/dns.yml

env:
  DNSCONTROL_VERSION: 5.7.1
  DNSCONTROL_SHA256: 6d2143af0453820b699da1ca8ae3f3e06ccbc0a912ea57f444b09d2f184736e9

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dnscontrol
        run: |
          curl -fsSL -o dnscontrol.tgz \
            "https://github.com/StackExchange/dnscontrol/releases/download/v${DNSCONTROL_VERSION}/dnscontrol_${DNSCONTROL_VERSION}_linux_amd64.tar.gz"
          echo "${DNSCONTROL_SHA256}  dnscontrol.tgz" | sha256sum -c -
          tar -xzf dnscontrol.tgz dnscontrol
          sudo install -m 0755 dnscontrol /usr/local/bin/dnscontrol

      - name: Check
        run: dnscontrol check

      - name: Preview
        run: dnscontrol preview 2>&1 | tee preview.txt

      - name: Comment plan on PR
        if: always() && hashFiles('preview.txt') != ''
        env:
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ job.status }}
        run: |
          marker='<!-- dnscontrol-plan -->'
          {
            echo "$marker"
            echo "### DNS plan (${OUTCOME})"
            echo
            echo '```'
            # Stay well under the 65536 character comment limit.
            sed 's/\x1b\[[0-9;]*m//g' preview.txt | tail -c 60000
            echo '```'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\")))] | first | .id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md
          fi

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: dns-apply
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dnscontrol
        run: |
          curl -fsSL -o dnscontrol.tgz \
            "https://github.com/StackExchange/dnscontrol/releases/download/v${DNSCONTROL_VERSION}/dnscontrol_${DNSCONTROL_VERSION}_linux_amd64.tar.gz"
          echo "${DNSCONTROL_SHA256}  dnscontrol.tgz" | sha256sum -c -
          tar -xzf dnscontrol.tgz dnscontrol
          sudo install -m 0755 dnscontrol /usr/local/bin/dnscontrol

      - name: Check
        run: dnscontrol check

      - name: Push
        run: dnscontrol push 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
